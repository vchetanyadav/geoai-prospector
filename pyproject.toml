[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geoai-prospector"
version = "0.1.0"
description = "Multi-modal ML and spatial AI for critical mineral prospectivity mapping (Northern Territory)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy", "pandas", "scipy", "pyyaml", "requests", "joblib", "matplotlib",
  "geopandas>=1.0", "shapely>=2.0", "rasterio>=1.3", "rioxarray", "xarray", "netCDF4", "pyproj",
  "scikit-learn>=1.3", "scikit-image>=0.22", "xgboost>=2.0", "shap>=0.44", "torch>=2.1",
  "streamlit>=1.35", "folium>=0.16", "streamlit-folium>=0.20",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
geoai = "geoai_prospector.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E402"]
